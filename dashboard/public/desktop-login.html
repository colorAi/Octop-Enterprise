<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Octop 企业版</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        background: #f6f7f9;
        color: #667185;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button {
        margin: 16px auto 0;
        padding: 8px 20px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e0e0e;
          color: #b5b5b5;
        }
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">正在进入工作界面…</div>
    <button id="retry" type="button" hidden>重试</button>
    <script id="octop-resume">
      (function () {
        // Fresh logins still use the native, origin-bound nonce handoff.
        if (location.hash !== "#resume") return;
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");
        var english = localStorage.getItem("octop:ui-locale") === "en";
        document.title = english ? "Octop Enterprise" : "Octop 企业版";
        document.documentElement.lang = english ? "en" : "zh-CN";
        retry.textContent = english ? "Retry" : "重试";
        function invoke(message) {
          if (window._wails && typeof window._wails.invoke === "function") {
            window._wails.invoke(message);
          } else if (
            window.chrome &&
            window.chrome.webview &&
            typeof window.chrome.webview.postMessage === "function"
          ) {
            // WebView2 exposes this before Wails injects _wails after navigation.
            window.chrome.webview.postMessage(message);
          } else {
            return false;
          }
          return true;
        }
        function emit(name) {
          return invoke("wails:event:emit:desktop:" + name);
        }
        async function acknowledgeResume() {
          for (var attempt = 0; attempt < 80; attempt++) {
            if (emit("login-resumed")) return;
            await new Promise(function (resolve) {
              setTimeout(resolve, 50);
            });
          }
          throw new Error("native_bridge_unavailable");
        }
        function signIn() {
          if (!emit("show-login")) location.replace("/login");
        }
        async function resume() {
          retry.hidden = true;
          status.textContent = english
            ? "Restoring your session…"
            : "正在恢复登录状态…";
          var token = localStorage.getItem("auth_token");
          if (!token) {
            signIn();
            return;
          }
          // Acknowledge immediately so the native startup timer does not turn
          // a slow or restarting server into a request to sign in again.
          try {
            await acknowledgeResume();
            var response = await fetch("/api/auth/me", {
              headers: { Authorization: "Bearer " + token },
              cache: "no-store",
            });
            if (response.status === 401) {
              localStorage.removeItem("auth_token");
              sessionStorage.removeItem("auth_token");
              signIn();
              return;
            }
            if (!response.ok) throw new Error("server_unavailable");
            var renewed = response.headers.get("X-Octop-Access-Token");
            if (renewed) localStorage.setItem("auth_token", renewed);
            // A cold start can leave native ExecJS waiting for the bundled
            // runtime that was replaced by this remote page during startup.
            invoke("wails:runtime:ready");
            location.replace("/chat");
          } catch (_) {
            status.textContent = english
              ? "The company server is temporarily unavailable. Retry when it is ready."
              : "公司服务器暂时无法连接，恢复后点击重试。";
            retry.hidden = false;
          }
        }
        retry.onclick = resume;
        void resume();
      })();
    </script>
  </body>
</html>
