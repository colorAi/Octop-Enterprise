name: octop-enterprise
x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: octop_bootstrap
      POSTGRES_PASSWORD: ${OCTOP_PG_BOOTSTRAP_PASSWORD:?Run prepare.py}
      OCTOP_APP_PASSWORD: ${OCTOP_APP_PASSWORD:?Run prepare.py}
      IM_APP_PASSWORD: ${IM_APP_PASSWORD:?Run prepare.py}
    volumes:
      - ${OCTOP_DATA_ROOT:?Set absolute data directory}/postgres:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
  communication:
    <<: *hardening
    image: ${OCTOP_IM_IMAGE:-octop-im:source}
    build: {context: ../../services/communication}
    environment:
      OCTOP_IM_DATABASE_URL: postgresql://im_app:${IM_APP_PASSWORD}@postgres:5432/octop_im?sslmode=disable
      OCTOP_IM_MEDIA_ROOT: /data/media
      OCTOP_IM_IDENTITY_KEY_FILE: /run/secrets/im_identity
      OCTOP_IM_CURSOR_KEY_FILE: /run/secrets/im_cursor
    secrets: [im_identity, im_cursor]
    volumes:
      - ${OCTOP_DATA_ROOT}/media:/data/media
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
    pids_limit: 128
    mem_limit: 512m
  octop:
    <<: *hardening
    image: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
    build:
      context: ../..
      dockerfile: docker/enterprise/Dockerfile
      args:
        APP_IMAGE: ${OCTOP_BASE_IMAGE:-octop:source}
    init: true
    user: '1000:1000'
    group_add: ['${OCTOP_DOCKER_GID:?Set Docker socket group id}']
    ports: ['${OCTOP_BIND_ADDRESS:-127.0.0.1}:${OCTOP_PORT:-8088}:8088']
    environment:
      HOME: /data
      OCTOP_HOME: /data/.octop
      OCTOP_DATABASE_URL: postgresql://octop_app:${OCTOP_APP_PASSWORD}@postgres:5432/octop?sslmode=disable
      OCTOP_DEVICE_CHANNEL_ENABLED: 'true'
      OCTOP_COMPANY_RUNTIME_ENABLED: 'true'
      OCTOP_IM_URL: http://communication:8090
      OCTOP_IM_IDENTITY_KEY_FILE: /run/secrets/im_identity
      OCTOP_AGENT_ISOLATION: docker
      OCTOP_SANDBOX_IMAGE: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
      OCTOP_SANDBOX_HOST_DATA_DIR: ${OCTOP_DATA_ROOT}/app
      OCTOP_MEDIA_HTTP_ORIGINS: ${OCTOP_MEDIA_HTTP_ORIGINS:-}
      OCTOP_DEFAULT_TIMEZONE: ${OCTOP_DEFAULT_TIMEZONE:-Asia/Shanghai}
    secrets: [im_identity]
    volumes:
      - ${OCTOP_DATA_ROOT}/app:/data/.octop
      - ${OCTOP_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks: [default, internal]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8088/api/health/ready]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3
    pids_limit: 512
    mem_limit: 2g
networks:
  internal: {internal: true}
secrets:
  im_identity: {file: '${OCTOP_DATA_ROOT}/secrets/im_identity'}
  im_cursor: {file: '${OCTOP_DATA_ROOT}/secrets/im_cursor'}
