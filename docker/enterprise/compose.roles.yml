# Separate deployment entry: do not combine with compose.yml.
name: octop-enterprise
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: octop_bootstrap
      POSTGRES_PASSWORD: ${OCTOP_PG_BOOTSTRAP_PASSWORD:?Run prepare.py}
      OCTOP_APP_PASSWORD: ${OCTOP_APP_PASSWORD:?Run prepare.py}
      IM_APP_PASSWORD: ${IM_APP_PASSWORD:?Run prepare.py}
    volumes:
    - ${OCTOP_DATA_ROOT:?Set absolute data directory}/postgres:/var/lib/postgresql/data
    - ./init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    networks:
    - internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d postgres
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${OCTOP_PG_MEMORY:-512m}
    command:
    - postgres
    - -c
    - max_connections=80
    - -c
    - shared_buffers=128MB
  communication:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${OCTOP_IM_IMAGE:-octop-im:source}
    build:
      context: ../../services/communication
    environment:
      OCTOP_IM_DATABASE_URL: postgresql://im_app:${IM_APP_PASSWORD}@postgres:5432/octop_im?sslmode=disable
      OCTOP_IM_MEDIA_ROOT: /data/media
      OCTOP_IM_IDENTITY_KEY_FILE: /run/secrets/im_identity
      OCTOP_IM_CURSOR_KEY_FILE: /run/secrets/im_cursor
      OCTOP_IM_POOL_MAX_CONNS: ${OCTOP_IM_POOL_MAX_CONNS:-8}
    secrets:
    - im_identity
    - im_cursor
    volumes:
    - ${OCTOP_DATA_ROOT}/media:/data/media
    networks:
    - internal
    depends_on:
      postgres:
        condition: service_healthy
    pids_limit: 128
    mem_limit: ${OCTOP_IM_MEMORY:-256m}
  worker:
    restart: 'no'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
    build:
      context: ../..
      dockerfile: docker/enterprise/Dockerfile
      args:
        APP_IMAGE: ${OCTOP_BASE_IMAGE:-octop:source}
    init: true
    user: 1000:1000
    group_add:
    - ${OCTOP_DOCKER_GID:?Set Docker socket group id}
    environment:
      HOME: /data
      OCTOP_HOME: /data/.octop
      OCTOP_DATABASE_URL: postgresql://octop_app:${OCTOP_APP_PASSWORD}@postgres:5432/octop?sslmode=disable
      OCTOP_DEVICE_CHANNEL_ENABLED: 'true'
      OCTOP_COMPANY_RUNTIME_ENABLED: 'true'
      OCTOP_IM_URL: http://communication:8090
      OCTOP_IM_IDENTITY_KEY_FILE: /run/secrets/im_identity
      OCTOP_AGENT_ISOLATION: docker
      OCTOP_SANDBOX_IMAGE: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
      OCTOP_SANDBOX_HOST_DATA_DIR: ${OCTOP_DATA_ROOT}/app
      OCTOP_MEDIA_HTTP_ORIGINS: ${OCTOP_MEDIA_HTTP_ORIGINS:-}
      OCTOP_DEFAULT_TIMEZONE: ${OCTOP_DEFAULT_TIMEZONE:-Asia/Shanghai}
      OCTOP_NODE_ID: runtime-worker
      OCTOP_NODE_INCARNATION: ${OCTOP_WORKER_BOOT:?Set a fresh nonce before recreating
        the worker}
      OCTOP_RESOURCE_PROFILE: ${OCTOP_RESOURCE_PROFILE:-4g}
      OCTOP_RUNTIME_IDLE_SECONDS: ${OCTOP_RUNTIME_IDLE_SECONDS:-300}
      OCTOP_DATABASE_POOL_MIN: '1'
      OCTOP_DATABASE_POOL_MAX: ${OCTOP_WORKER_POOL_MAX:-4}
      OCTOP_SANDBOX_MEMORY: ${OCTOP_SANDBOX_MEMORY:-256m}
      OCTOP_MAX_UPLOAD_MB: ${OCTOP_MAX_UPLOAD_MB:-32}
    secrets:
    - im_identity
    volumes:
    - ${OCTOP_DATA_ROOT}/app:/data/.octop
    - ${OCTOP_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
    - default
    - internal
    depends_on:
      postgres:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
      communication:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8088/api/health/ready
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3
    pids_limit: 512
    mem_limit: ${OCTOP_WORKER_MEMORY:-1152m}
    command:
    - octop
    - run
    - --role
    - worker
    - --host
    - 0.0.0.0
    - --port
    - '8088'
    labels:
      org.octop.node: runtime-worker
      org.octop.incarnation: ${OCTOP_WORKER_BOOT}
    stop_grace_period: 60s
  initialize:
    restart: 'no'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
    build:
      context: ../..
      dockerfile: docker/enterprise/Dockerfile
      args:
        APP_IMAGE: ${OCTOP_BASE_IMAGE:-octop:source}
    init: true
    user: 1000:1000
    environment:
      HOME: /data
      OCTOP_HOME: /data/.octop
      OCTOP_DATABASE_URL: postgresql://octop_app:${OCTOP_APP_PASSWORD}@postgres:5432/octop?sslmode=disable
      OCTOP_DEVICE_CHANNEL_ENABLED: 'true'
      OCTOP_COMPANY_RUNTIME_ENABLED: 'true'
      OCTOP_IM_URL: http://communication:8090
      OCTOP_IM_IDENTITY_KEY_FILE: /run/secrets/im_identity
      OCTOP_AGENT_ISOLATION: docker
      OCTOP_SANDBOX_IMAGE: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
      OCTOP_SANDBOX_HOST_DATA_DIR: ${OCTOP_DATA_ROOT}/app
      OCTOP_MEDIA_HTTP_ORIGINS: ${OCTOP_MEDIA_HTTP_ORIGINS:-}
      OCTOP_DEFAULT_TIMEZONE: ${OCTOP_DEFAULT_TIMEZONE:-Asia/Shanghai}
      OCTOP_NODE_ID: runtime-worker
      OCTOP_RESOURCE_PROFILE: ${OCTOP_RESOURCE_PROFILE:-4g}
      OCTOP_WORKER_URLS: ${OCTOP_WORKER_URLS:-}
      OCTOP_MODEL_CONCURRENCY: ${OCTOP_MODEL_CONCURRENCY:-0}
      OCTOP_SANDBOX_TOTAL_MEMORY: ${OCTOP_SANDBOX_TOTAL_MEMORY:-512m}
      OCTOP_DATABASE_POOL_MIN: '1'
      OCTOP_DATABASE_POOL_MAX: '1'
      OCTOP_SANDBOX_MEMORY: ${OCTOP_SANDBOX_MEMORY:-256m}
      OCTOP_MAX_UPLOAD_MB: ${OCTOP_MAX_UPLOAD_MB:-32}
    secrets:
    - im_identity
    volumes:
    - ${OCTOP_DATA_ROOT}/app:/data/.octop
    networks:
    - default
    - internal
    depends_on:
      postgres:
        condition: service_healthy
    pids_limit: 512
    mem_limit: 768m
    command:
    - octop
    - run
    - --role
    - init
  web1:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
    init: true
    user: 1000:1000
    environment:
      HOME: /data
      OCTOP_HOME: /data/.octop
      OCTOP_DATABASE_URL: postgresql://octop_app:${OCTOP_APP_PASSWORD}@postgres:5432/octop?sslmode=disable
      OCTOP_RESOURCE_PROFILE: ${OCTOP_RESOURCE_PROFILE:-4g}
      OCTOP_DATABASE_POOL_MIN: '1'
      OCTOP_MAX_UPLOAD_MB: ${OCTOP_MAX_UPLOAD_MB:-32}
      OCTOP_WORKER_URL: http://worker:8088
      OCTOP_IM_URL: http://communication:8090
      OCTOP_IM_IDENTITY_KEY_FILE: /run/secrets/im_identity
      OCTOP_DATABASE_POOL_MAX: ${OCTOP_WEB_POOL_MAX:-2}
    secrets:
    - im_identity
    volumes:
    - ${OCTOP_DATA_ROOT}/app:/data/.octop:ro
    networks:
    - default
    - internal
    depends_on:
      initialize:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
      worker2:
        condition: service_healthy
        required: false
      worker3:
        condition: service_healthy
        required: false
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8088/api/health/ready
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3
    pids_limit: 64
    mem_limit: ${OCTOP_WEB_MEMORY:-320m}
    command:
    - octop
    - run
    - --role
    - web
    - --host
    - 0.0.0.0
    - --port
    - '8088'
    stop_grace_period: 60s
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
  web2:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${OCTOP_APP_IMAGE:-octop-enterprise:source}
    init: true
    user: 1000:1000
    environment:
      HOME: /data
      OCTOP_HOME: /data/.octop
      OCTOP_DATABASE_URL: postgresql://octop_app:${OCTOP_APP_PASSWORD}@postgres:5432/octop?sslmode=disable
      OCTOP_RESOURCE_PROFILE: ${OCTOP_RESOURCE_PROFILE:-4g}
      OCTOP_DATABASE_POOL_MIN: '1'
      OCTOP_MAX_UPLOAD_MB: ${OCTOP_MAX_UPLOAD_MB:-32}
      OCTOP_WORKER_URL: http://worker:8088
      OCTOP_IM_URL: http://communication:8090
      OCTOP_IM_IDENTITY_KEY_FILE: /run/secrets/im_identity
      OCTOP_DATABASE_POOL_MAX: ${OCTOP_WEB_POOL_MAX:-2}
    secrets:
    - im_identity
    volumes:
    - ${OCTOP_DATA_ROOT}/app:/data/.octop:ro
    networks:
    - default
    - internal
    depends_on:
      initialize:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8088/api/health/ready
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3
    pids_limit: 64
    mem_limit: ${OCTOP_WEB_MEMORY:-320m}
    command:
    - octop
    - run
    - --role
    - web
    - --host
    - 0.0.0.0
    - --port
    - '8088'
    stop_grace_period: 60s
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
  worker2:
    extends:
      service: worker
    profiles: [two-workers, three-workers]
    environment:
      OCTOP_NODE_ID: runtime-worker2
      OCTOP_NODE_INCARNATION: ${OCTOP_WORKER2_BOOT:-${OCTOP_WORKER_BOOT}}
    labels:
      org.octop.node: runtime-worker2
      org.octop.incarnation: ${OCTOP_WORKER2_BOOT:-${OCTOP_WORKER_BOOT}}
  worker3:
    extends:
      service: worker
    profiles: [three-workers]
    environment:
      OCTOP_NODE_ID: runtime-worker3
      OCTOP_NODE_INCARNATION: ${OCTOP_WORKER3_BOOT:-${OCTOP_WORKER_BOOT}}
    labels:
      org.octop.node: runtime-worker3
      org.octop.incarnation: ${OCTOP_WORKER3_BOOT:-${OCTOP_WORKER_BOOT}}
  web3:
    extends:
      service: web1
    profiles: [three-workers]
  edge:
    image: ${OCTOP_PROXY_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
    - ${OCTOP_BIND_ADDRESS:-127.0.0.1}:${OCTOP_PORT:-8088}:8080
    volumes:
    - ./roles-nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^OCTOP_WEB3_UPSTREAM$$
      OCTOP_WEB3_UPSTREAM: ${OCTOP_WEB3_UPSTREAM:-}
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
        required: false
    mem_limit: 64m
    pids_limit: 64
    logging: *id001
    networks:
    - default
    - internal
networks:
  internal:
    internal: true
secrets:
  im_identity:
    file: ${OCTOP_DATA_ROOT}/secrets/im_identity
  im_cursor:
    file: ${OCTOP_DATA_ROOT}/secrets/im_cursor
